apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: ci-failure-explainer
  namespace: ci-failure-explainer
spec:
  # Jenkins waits for the diagnosis, including the provider's rate-limit backoff.
  timeoutSec: 300
  healthCheck:
    type: HTTP
    requestPath: /healthz
    port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: ci-failure-explainer
  namespace: ci-failure-explainer
  annotations:
    cloud.google.com/neg: '{"ingress":true}'
    cloud.google.com/backend-config: '{"default":"ci-failure-explainer"}'
spec:
  selector:
    app: ci-failure-explainer
  ports:
    - name: http
      port: 80
      targetPort: http
