apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-delivery
  namespace: ci-failure-explainer
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [create, get, list, watch, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-delivery
  namespace: ci-failure-explainer
subjects:
  - kind: User
    name: ci-explainer-delivery@PROJECT_ID.iam.gserviceaccount.com
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: ci-delivery
  apiGroup: rbac.authorization.k8s.io
