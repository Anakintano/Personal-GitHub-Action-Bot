name: CI and delivery

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: delivery-${{ github.ref }}

jobs:
  delivery:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Lint Python
        run: |
          python -m pip install ruff
          ruff check .
      - name: Build image
        run: docker build --tag "ci-failure-explainer:${GITHUB_SHA}" .
      - name: Authenticate to Google Cloud
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.GCP_PROJECT_ID != ''
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DELIVERY_SERVICE_ACCOUNT }}
      - name: Install Google Cloud CLI
        if: steps.auth.outcome == 'success'
        uses: google-github-actions/setup-gcloud@v3
      - name: Push image
        if: steps.auth.outcome == 'success'
        id: push
        run: |
          registry="${GCP_REGION}-docker.pkg.dev"
          gcloud auth configure-docker "$registry" --quiet
          image="$registry/$GCP_PROJECT_ID/ci-failure-explainer/app:$GITHUB_SHA"
          docker tag "ci-failure-explainer:$GITHUB_SHA" "$image"
          docker push "$image"
          echo "image=$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")" >> "$GITHUB_OUTPUT"
      - name: Get GKE credentials
        if: steps.auth.outcome == 'success'
        uses: google-github-actions/get-gke-credentials@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          location: ${{ env.GCP_REGION }}
          cluster_name: ci-failure-explainer
      - name: Deploy
        if: steps.auth.outcome == 'success'
        env:
          DEPLOY_IMAGE: ${{ steps.push.outputs.image }}
        run: bash infra/deploy.sh "$DEPLOY_IMAGE"
